<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Gantt chart</title>
  <link rel="stylesheet" href="src/panel.css">
</head>
<body>
  <header class="toolbar">
    <input id="search" type="search" placeholder="Search issues" aria-label="Search issues">
    <button type="button" id="assignee" class="filter" popovertarget="assignee-menu" title="Filter by assignee" data-all="All assignees" data-many="assignees">All assignees</button>
    <div id="assignee-menu" class="menu" popover></div>
    <button type="button" id="status" class="filter" popovertarget="status-menu" title="Filter by status" data-all="All statuses" data-many="statuses">All statuses</button>
    <div id="status-menu" class="menu" popover></div>
    <label class="group-by">Group by
      <select id="group-by">
        <option value="none">None</option>
        <option value="parent">Parent</option>
        <option value="assignee">Assignee</option>
      </select>
    </label>
    <div class="segmented" role="group" aria-label="Time scale">
      <button type="button" data-scale="day" aria-pressed="false">Day</button>
      <button type="button" data-scale="week" aria-pressed="true">Week</button>
      <button type="button" data-scale="month" aria-pressed="false">Month</button>
    </div>
    <button type="button" id="today">Today</button>
    <span class="spacer"></span>
    <span id="count"></span>
    <button type="button" id="refresh">Refresh</button>
  </header>
  <p id="notice" role="status" hidden></p>
  <section id="gate" hidden>
    <h1 id="gate-title"></h1>
    <p id="gate-text"></p>
    <button type="button" id="gate-action" class="primary" hidden></button>
  </section>
  <main id="chart" aria-label="Gantt chart" hidden></main>
  <footer class="legend" id="legend" hidden>
    <span><i class="legend-bar"></i>Actual start to due date</span>
    <span><i class="legend-marker"></i>Due date, not started</span>
    <span><i class="legend-milestone"></i>Milestone target date</span>
  </footer>
  <script type="module" src="src/panel.js"></script>
</body>
</html>
